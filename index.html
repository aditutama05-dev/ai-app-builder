<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Diskon & Pajak</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0b1329;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }

    h2 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 6px;
      color: #ffffff;
    }

    p.subtitle {
      font-size: 0.875rem;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .prefix {
      position: absolute;
      left: 12px;
      color: #64748b;
      font-size: 0.95rem;
      font-weight: 600;
      pointer-events: none;
    }

    input {
      width: 100%;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 1rem;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }

    input.has-prefix {
      padding-left: 42px;
    }

    input:focus {
      border-color: #3b82f6;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-calculate {
      background-color: #2563eb;
      color: #ffffff;
    }

    .btn-calculate:hover {
      background-color: #1d4ed8;
    }

    .btn-reset {
      background-color: #334155;
      color: #cbd5e1;
    }

    .btn-reset:hover {
      background-color: #475569;
    }

    .result-box {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #334155;
      display: none;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed #334155;
      font-size: 1.1rem;
      font-weight: 700;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Kalkulator Diskon</h2>
    <p class="subtitle">Hitung potongan diskon dan pajak belanjaan</p>

    <!-- Input Harga Asli -->
    <div class="form-group">
      <label for="displayPrice">Harga Asli (Rp)</label>
      <div class="input-wrapper">
        <span class="prefix">Rp</span>
        <input type="text" id="displayPrice" class="has-prefix" placeholder="Misal: 50.000" inputmode="numeric" oninput="formatRupiahInput(this)">
      </div>
    </div>

    <!-- Input Diskon -->
    <div class="form-group">
      <label for="discount">Diskon (%)</label>
      <input type="number" id="discount" placeholder="Misal: 15" min="0" max="100">
    </div>

    <!-- Input Pajak / PPN -->
    <div class="form-group">
      <label for="tax">Pajak / PPN (%) <span style="font-size: 0.75rem; color: #64748b;">(Opsional)</span></label>
      <input type="number" id="tax" placeholder="Misal: 11" min="0" value="0">
    </div>

    <div class="btn-group">
      <button class="btn-reset" onclick="resetForm()">Reset</button>
      <button class="btn-calculate" onclick="hitungSemua()">Hitung Total</button>
    </div>

    <!-- Bagian Hasil Hitung -->
    <div class="result-box" id="resultArea">
      <div class="row">
        <span>Harga Awal:</span>
        <span id="resOriginal">Rp 0</span>
      </div>
      <div class="row">
        <span>Potongan Diskon:</span>
        <span id="resDiscount" style="color: #4ade80;">- Rp 0</span>
      </div>
      <div class="row">
        <span>Pajak Tambahan:</span>
        <span id="resTax" style="color: #f87171;">+ Rp 0</span>
      </div>
      <div class="total-row">
        <span>Total Bayar:</span>
        <span id="resTotal">Rp 0</span>
      </div>
    </div>
  </div>

  <script>
    // Fungsi agar saat mengetik harga otomatis muncul titik ribuan
    function formatRupiahInput(input) {
      let angka = input.value.replace(/[^0-9]/g, '');
      if (!angka) {
        input.value = '';
        return;
      }
      input.value = new Intl.NumberFormat('id-ID').format(angka);
    }

    function ambilAngkaMurni(text) {
      return parseFloat(text.replace(/\./g, '')) || 0;
    }

    function hitungSemua() {
      const hargaAsli = ambilAngkaMurni(document.getElementById('displayPrice').value);
      const diskonPersen = parseFloat(document.getElementById('discount').value) || 0;
      const pajakPersen = parseFloat(document.getElementById('tax').value) || 0;

      if (hargaAsli <= 0) {
        alert('Harap masukkan harga asli terlebih dahulu!');
        return;
      }

      // 1. Hitung potongan diskon
      const nominalDiskon = hargaAsli * (diskonPersen / 100);
      const hargaSetelahDiskon = hargaAsli - nominalDiskon;

      // 2. Hitung pajak dari harga yang sudah didiskon
      const nominalPajak = hargaSetelahDiskon * (pajakPersen / 100);

      // 3. Hitung total akhir
      const totalBayar = hargaSetelahDiskon + nominalPajak;

      // Format ke tampilan Rupiah
      const formatRupiah = (val) => 'Rp ' + Math.round(val).toLocaleString('id-ID');

      document.getElementById('resOriginal').innerText = formatRupiah(hargaAsli);
      document.getElementById('resDiscount').innerText = '- ' + formatRupiah(nominalDiskon);
      document.getElementById('resTax').innerText = '+ ' + formatRupiah(nominalPajak);
      document.getElementById('resTotal').innerText = formatRupiah(totalBayar);

      document.getElementById('resultArea').style.display = 'block';
    }

    function resetForm() {
      document.getElementById('displayPrice').value = '';
      document.getElementById('discount').value = '';
      document.getElementById('tax').value = '0';
      document.getElementById('resultArea').style.display = 'none';
    }
  </script>
</body>
</html>
