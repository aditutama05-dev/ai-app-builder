<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Kalkulator Diskon</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      background: radial-gradient(circle at top, #1e3a5f 0, #0f172a 45%);
    }

    .card {
      width: min(100%, 400px);
      padding: 28px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 16px;
      background: rgba(30, 41, 59, 0.94);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.32);
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      line-height: 1.25;
      text-align: center;
    }

    .subtitle {
      margin: 8px 0 24px;
      color: #94a3b8;
      font-size: 0.9375rem;
      text-align: center;
    }

    .input-group { margin-bottom: 18px; }

    label {
      display: block;
      margin-bottom: 7px;
      color: #cbd5e1;
      font-size: 0.875rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #475569;
      border-radius: 8px;
      outline: none;
      background: #0f172a;
      color: #f8fafc;
      font: inherit;
    }

    input::placeholder { color: #64748b; }
    input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18); }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 150ms ease, transform 150ms ease;
    }

    button:hover { background: #1d4ed8; }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid #7dd3fc; outline-offset: 3px; }

    .error {
      min-height: 1.3em;
      margin: 12px 0 0;
      color: #fda4af;
      font-size: 0.875rem;
    }

    .result {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #475569;
    }

    .result[hidden] { display: none; }

    .result p {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin: 8px 0;
      color: #cbd5e1;
    }

    .result span { font-variant-numeric: tabular-nums; }
    .total { color: #7dd3fc !important; font-size: 1.0625rem; font-weight: 800; }

    @media (max-width: 420px) {
      body { padding: 16px; }
      .card { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Kalkulator Diskon</h1>
    <p class="subtitle">Hitung harga akhir setelah potongan diskon.</p>

    <form id="discountForm" novalidate>
      <div class="input-group">
        <label for="price">Harga Asli (Rp)</label>
        <input type="number" id="price" name="price" min="0" step="any" inputmode="decimal" placeholder="Misal: 100000" required>
      </div>

      <div class="input-group">
        <label for="discount">Diskon (%)</label>
        <input type="number" id="discount" name="discount" min="0" max="100" step="any" inputmode="decimal" placeholder="Misal: 20" required>
      </div>

      <button type="submit">Hitung Total</button>
      <p class="error" id="errorMessage" role="alert" aria-live="polite"></p>
    </form>

    <section class="result" id="resultArea" hidden aria-live="polite" aria-label="Hasil perhitungan">
      <p>Potongan: <span id="discountAmount">Rp0</span></p>
      <p class="total">Total Bayar: <span id="finalPrice">Rp0</span></p>
    </section>
  </main>

  <script>
    const form = document.getElementById('discountForm');
    const priceInput = document.getElementById('price');
    const discountInput = document.getElementById('discount');
    const resultArea = document.getElementById('resultArea');
    const errorMessage = document.getElementById('errorMessage');
    const formatter = new Intl.NumberFormat('id-ID', {
      style: 'currency',
      currency: 'IDR',
      maximumFractionDigits: 2
    });

    function formatRupiah(value) {
      return formatter.format(value).replace(/\s/g, '');
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const price = Number(priceInput.value);
      const discount = Number(discountInput.value);

      if (!priceInput.value || !discountInput.value || !Number.isFinite(price) || !Number.isFinite(discount)) {
        errorMessage.textContent = 'Masukkan harga dan diskon terlebih dahulu.';
        resultArea.hidden = true;
        return;
      }

      if (price < 0 || discount < 0 || discount > 100) {
        errorMessage.textContent = 'Harga tidak boleh negatif dan diskon harus antara 0–100%.';
        resultArea.hidden = true;
        return;
      }

      const discountAmount = price * (discount / 100);
      const finalPrice = price - discountAmount;

      document.getElementById('discountAmount').textContent = formatRupiah(discountAmount);
      document.getElementById('finalPrice').textContent = formatRupiah(finalPrice);
      errorMessage.textContent = '';
      resultArea.hidden = false;
    });
  </script>
</body>
</html>
